<!-- ADICIONE este bloco dentro do painel do perfil, logo após o elemento #avatar -->
<div class="profile-avatar-actions">
  <label class="primary upload">
    Alterar foto de perfil
    <input id="avatarInput" type="file" accept="image/*" hidden>
  </label>
  <small>Imagem JPG, PNG ou WebP • até 5 MB</small>
</div>

<!-- ADICIONE este modal antes do modal #viewer, perto do fim do index.html -->
<dialog id="editGroupDialog">
  <form id="editGroupForm">
    <h2>Editar grupo</h2>
    <p class="muted">Altere o nome ou a imagem do grupo.</p>
    <input id="editGroupId" type="hidden">
    <label for="editGroupName">Nome do grupo</label>
    <input id="editGroupName" required minlength="2" maxlength="50">
    <label for="editGroupAvatar">Imagem do grupo (opcional)</label>
    <input id="editGroupAvatar" type="file" accept="image/*">
    <div class="dialog-actions">
      <button id="cancelEditGroup" class="secondary" type="button">Cancelar</button>
      <button class="primary" type="submit">Salvar alterações</button>
    </div>
  </form>
</dialog>
